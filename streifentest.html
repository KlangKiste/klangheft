<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klangheft – Streifentest</title>
<style>
  body { margin: 0; padding: 16px 24px; background: #c9a877; font-family: Andika, sans-serif; font-size: 18px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.info { margin: 0 0 12px; }
  .reihe { display: flex; align-items: center; gap: 16px; margin: 0 0 10px; }
  .nr { flex: none; width: 56px; height: 56px; display: grid; place-items: center; background: #22292e; color: #fff; font-size: 30px; font-weight: 700; }
  .was { flex: none; width: 230px; }
  .blattwrap { flex: 1; min-width: 0; }
  .blatt { padding: 10px; }
  .spur-test { position: relative; height: 104px; }
  /* Varianten */
  .v-nomix .u-teil { mix-blend-mode: normal !important; }
  .v-noclip .u-teil { clip-path: none !important; }
  .v-nofilter.papier { filter: none !important; }
  .v-nograin.papier::before { background: var(--c, var(--papier)) !important; }
  .v-nolines .u-flaechen { background: none !important; }
  .v-noopac .u-teil { opacity: 1 !important; }
</style>
</head>
<body>
<h1>Streifentest</h1>
<p class="info">Welche Nummern zeigen schräge Streifen in den farbigen Flächen? Datum: <span id="info"></span></p>
<div id="tests" class="untersuchen"></div>
<script>
  // Stile genau wie in Klangheft: das Stylesheet der App aus index.html übernehmen
  fetch('./').then((r) => r.text()).then((html) => {
    const m = html.match(/href="([^"]*assets\/index-[^"]*\.css)"/);
    if (m) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = m[1]; document.head.append(l); }
  });
  document.getElementById('info').textContent = `${navigator.userAgent} · dpr ${window.devicePixelRatio}`;
  const varianten = [
    ['', 'wie in Klangheft', true],
    ['', 'ohne Zeichenfläche (Canvas)', false],
    ['v-nomix', 'ohne Multiplizieren', true],
    ['v-noopac', 'ohne Durchscheinen', true],
    ['v-noclip', 'ohne gerissene Kante', true],
    ['v-nofilter', 'ohne Schatten am Blatt', true],
    ['v-nograin', 'ohne Papierkörnung', true],
    ['v-nolines', 'ohne Linien', true],
  ];
  const teile = [['#d9c74a', 0, 30], ['#f09a62', 30, 12], ['#8f6ee0', 42, 38], ['#62c7c0', 80, 20]];
  const tests = document.getElementById('tests');
  varianten.forEach(([cls, was, mitCanvas], i) => {
    const reihe = document.createElement('div');
    reihe.className = 'reihe';
    const blattCls = cls === 'v-nofilter' || cls === 'v-nograin' ? cls : '';
    reihe.innerHTML = `<div class="nr">${i + 1}</div><div class="was">${was}</div>
      <div class="blattwrap"><div class="blatt u-blatt papier ${blattCls}"><div class="spur-test ${blattCls ? '' : cls}">
        <div class="u-spur ohne-welle" style="top:0"><div class="u-flaechen">${teile.map(([c, l, w], k) =>
          `<div class="u-teil${k === 2 ? ' cur' : ''}" style="left:${l}%;width:${w}%;--farbe:${c}"></div>`).join('')}</div></div>
      </div></div></div>`;
    tests.append(reihe);
    if (mitCanvas) {
      const spur = reihe.querySelector('.u-spur');
      const cv = document.createElement('canvas');
      cv.className = 'u-welle';
      spur.append(cv);
      requestAnimationFrame(() => {
        const w = cv.clientWidth, hgt = cv.clientHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 16000 / w);
        cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
        const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, hgt);
      });
    }
  });
</script>
</body>
</html>
